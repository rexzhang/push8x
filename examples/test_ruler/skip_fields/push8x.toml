# Test skip_from_value - skip emails from specific sender addresses

[logging]
log_ruler_droped_msg = true

[[rules]]
name = "R001"
enable = true
sender_name = "apprise"
skip_from_value = "spam@blocked.com"
match_to_value = "*"
new_to_value = "pover://user@token"

[[rules]]
name = "R002"
enable = true
sender_name = "blackhole"
match_to_value = "*"