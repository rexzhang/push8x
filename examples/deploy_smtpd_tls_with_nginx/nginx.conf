http {
    server {
        listen      443 ssl;
        listen      [::]:443 ssl;
        http2       on;
        server_name push8x.com;

        set $proxy_pass "http://192.168.1.111:8000";

        proxy_buffering off; ## Sends data as fast as it can not buffering large chunks.

        # SSL certificate
        ssl_certificate     /data/push8x.com/fullchain.pem;
        ssl_certificate_key /data/push8x.com/privkey.pem;
        include /app/nginx/snippets/ssl-params.conf;

        location / {
            include /app/nginx/snippets/proxy-params.conf;
            proxy_pass $proxy_pass;
        }
    }
}

mail {
	server {
        listen          465 ssl;
        protocol        smtp;
        proxy_protocol  on;
        xclient         on;

        # SSL certificate
        ssl_certificate     /data/push8x.com/fullchain.pem;
        ssl_certificate_key /data/push8x.com/privkey.pem;
        include /app/nginx/snippets/ssl-params.conf;

        smtp_auth login plain;
        auth_http 192.168.1.111:8000/api/smtpd/auth;
    }
}
